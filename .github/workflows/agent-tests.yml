name: AI Stayl Agent Tests
on:
  push:
    branches:
      - safe-ai-stayl
      - 'feature/agent-browser-research-*'
    paths:
      - 'ai-stayl-app/backend/**'
      - '.github/workflows/agent-tests.yml'
  pull_request:
    paths:
      - 'ai-stayl-app/backend/**'
      - '.github/workflows/agent-tests.yml'
jobs:
  worker-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate worker and run isolated tests
        run: npm test
        working-directory: ai-stayl-app/backend
