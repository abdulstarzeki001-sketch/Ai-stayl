name: Deploy AI Stayl Pages

on:
  push:
    branches: [main]
    paths:
      - ai-stayl-app/index.html
      - ai-stayl-app/agent.html
      - ai-stayl-app/agent.css
      - ai-stayl-app/agent.js
      - ai-stayl-app/backend/**
      - .github/workflows/ai-stayl-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Agent before publishing
        working-directory: ai-stayl-app/backend
        run: npm test
      - uses: actions/configure-pages@v5
      - name: Stage public pages
        run: |
          mkdir public
          cp ai-stayl-app/{index.html,agent.html,agent.css,agent.js} public/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4
        id: deployment
