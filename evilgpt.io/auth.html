<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI-Stayl | تسجيل الدخول</title><style>body{font-family:system-ui;background:#0c1425;color:#fff;min-height:100vh;display:grid;place-items:center}.card{background:#19253a;padding:32px;border-radius:18px;width:min(90vw,420px)}input,button{box-sizing:border-box;width:100%;padding:13px;margin:8px 0;border-radius:8px;border:1px solid #526481;background:#101b2c;color:white}button{background:#789eff;color:#061225;cursor:pointer}a{color:#a7bfff}#status{min-height:24px}</style></head><body><main class="card"><h1>AI-Stayl</h1><p>الدخول إلى حساب الإدارة</p><form id="form"><label>البريد الإلكتروني<input type="email" value="abdulstarzeki001@gmail.com" readonly></label><label>كلمة المرور<input id="password" type="password" minlength="8" autocomplete="current-password" required></label><button type="submit">تسجيل الدخول</button></form><button id="signup" type="button">إنشاء الحساب لأول مرة</button><p><a href="/reset-password">نسيت كلمة المرور؟</a></p><p id="status" role="status"></p></main><script type="module">
import {t as supabase} from "./assets/client-DcPTJvB5.js";
const email="abdulstarzeki001@gmail.com",status=document.getElementById("status"),password=document.getElementById("password");
async function verify(){const {data,error}=await supabase.auth.getUser();if(!error&&data?.user?.email?.toLowerCase()===email&&!data.user.is_anonymous){location.replace("/chat");return true;}return false;}
document.getElementById("form").onsubmit=async e=>{e.preventDefault();status.textContent="جارٍ تسجيل الدخول...";const {error}=await supabase.auth.signInWithPassword({email,password:password.value});if(error){status.textContent=error.message;return;}if(!await verify())status.textContent="الحساب غير مصرح له."};
document.getElementById("signup").onclick=async()=>{if(password.value.length<8){status.textContent="كلمة المرور 8 أحرف على الأقل";return;}const {error}=await supabase.auth.signUp({email,password:password.value,options:{emailRedirectTo:location.origin+"/auth"}});status.textContent=error?error.message:"تحقق من رسالة تأكيد البريد الإلكتروني."};
verify().catch(()=>{});
</script></body></html>
