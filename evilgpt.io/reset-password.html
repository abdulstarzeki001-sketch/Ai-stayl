<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI-Stayl | إعادة تعيين كلمة المرور</title><style>body{font-family:system-ui;background:#0c1425;color:#fff;min-height:100vh;display:grid;place-items:center}.card{background:#19253a;padding:32px;border-radius:18px;width:min(90vw,420px)}input,button{box-sizing:border-box;width:100%;padding:13px;margin:8px 0;border-radius:8px;border:1px solid #526481;background:#101b2c;color:white}button{background:#789eff;color:#061225;cursor:pointer}a{color:#a7bfff}#status{min-height:24px}.hidden{display:none}</style></head><body><main class="card"><h1>إعادة تعيين كلمة المرور</h1><label>البريد الإلكتروني<input type="email" value="abdulstarzeki001@gmail.com" readonly></label><button id="send">إرسال رسالة الاستعادة</button><label>رمز البريد (اختياري)<input id="otp" inputmode="numeric" autocomplete="one-time-code" placeholder="رمز الاستعادة"></label><button id="verify">التحقق من الرمز</button><form id="new" class="hidden"><label>كلمة المرور الجديدة<input id="pass" type="password" minlength="8" required></label><label>تأكيد كلمة المرور<input id="confirm" type="password" minlength="8" required></label><button type="submit">حفظ كلمة المرور</button></form><p id="status" role="status"></p><a href="/auth">العودة للدخول</a></main><script type="module">
import {t as supabase} from "./assets/client-DcPTJvB5.js";
const email="abdulstarzeki001@gmail.com",status=document.getElementById("status"),newForm=document.getElementById("new");
const params=new URLSearchParams(location.search),hash=new URLSearchParams(location.hash.slice(1));
const fromRecovery=params.has("token_hash")||params.has("code")||hash.has("access_token")||hash.get("type")==="recovery";
let ready=false;
async function unlock(){const {data,error}=await supabase.auth.getUser();if(error||data?.user?.email?.toLowerCase()!==email){status.textContent="رابط الاستعادة غير صالح";return;}ready=true;newForm.classList.remove("hidden");status.textContent="أدخل كلمة المرور الجديدة";history.replaceState(null,"",location.pathname);}
supabase.auth.onAuthStateChange(event=>{if(event==="PASSWORD_RECOVERY"&&fromRecovery)unlock().catch(()=>{});});
(async()=>{if(params.get("token_hash")&&params.get("type")==="recovery"){const {error}=await supabase.auth.verifyOtp({token_hash:params.get("token_hash"),type:"recovery"});if(error)status.textContent=error.message;else await unlock();}else if(params.get("code")){const {error}=await supabase.auth.exchangeCodeForSession(params.get("code"));if(error)status.textContent=error.message;else await unlock();}else if(fromRecovery){await supabase.auth.getSession();await unlock();}})().catch(()=>{});
document.getElementById("send").onclick=async()=>{status.textContent="جارٍ إرسال الطلب...";const {error}=await supabase.auth.resetPasswordForEmail(email,{redirectTo:location.origin+"/reset-password"});status.textContent=error?error.message:"تم قبول الطلب. تحقق من البريد إذا كان الحساب موجوداً وخدمة الإرسال تعمل."};
document.getElementById("verify").onclick=async()=>{const token=document.getElementById("otp").value.trim();if(!/^\d{6,8}$/.test(token)){status.textContent="أدخل رمز البريد";return;}const {error}=await supabase.auth.verifyOtp({email,token,type:"recovery"});if(error)status.textContent=error.message;else await unlock();};
newForm.onsubmit=async e=>{e.preventDefault();if(!ready)return;const password=document.getElementById("pass").value;if(password.length<8||password!==document.getElementById("confirm").value){status.textContent="تأكد من كلمة المرور وتطابقها (8 أحرف على الأقل)";return;}const {error}=await supabase.auth.updateUser({password});if(error)status.textContent=error.message;else{status.textContent="تم تحديث كلمة المرور";location.replace("/chat");}};
</script></body></html>
