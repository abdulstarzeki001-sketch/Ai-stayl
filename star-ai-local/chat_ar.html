<!doctype html>
<html lang="ar" dir="rtl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STAR AI MANAGER</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101722;color:#e9eff8;font:16px/1.65 "Segoe UI",Tahoma,sans-serif}main{width:min(760px,94vw);margin:5vh auto}h1{font-size:1.5rem}#chat{min-height:12rem;max-height:55vh;overflow:auto;padding:14px 0}.message{white-space:pre-wrap;overflow-wrap:anywhere;text-align:start;border-radius:10px;background:#202c3d;padding:12px 16px;margin:8px 0}.user{background:#243b57}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}textarea{display:block;width:100%;resize:vertical;padding:12px;border:1px solid #64748b;border-radius:8px;background:#182332;color:inherit;font:inherit;text-align:start}button{padding:8px 14px;border:0;border-radius:7px;background:#acd4ff;color:#102041;font:inherit;cursor:pointer}button:disabled{opacity:.5;cursor:default}#permission{background:#29354a;padding:12px;border-radius:8px;margin:10px 0}
</style>
<main>
<h1 dir="ltr">STAR AI MANAGER</h1>
<div id="chat" role="log" aria-live="polite"></div>
<section id="permission" hidden>
<p id="prompt" dir="auto"></p>
<button id="yes" type="button">تنفيذ</button>
<button id="no" type="button">إلغاء</button>
</section>
<form id="form">
<textarea id="message" dir="auto" rows="3" maxlength="6000" placeholder="اكتب رسالتك هنا" aria-label="رسالتك" required></textarea>
<div class="controls">
<button id="send">إرسال</button>
<button type="button" data-command="/status">حالة الجهاز</button>
<button type="button" data-command="/kali">فحص Kali</button>
<button type="button" data-command="افتح المفكرة">فتح المفكرة</button>
</div>
</form>
</main>
<script>
const token = "__STAR_TOKEN__";
const chat = document.querySelector("#chat");
const input = document.querySelector("#message");
const permission = document.querySelector("#permission");
const prompt = document.querySelector("#prompt");
const buttons = [...document.querySelectorAll("#send,[data-command]")];
let busy = false;
const pause = ms => new Promise(resolve => setTimeout(resolve, ms));
function add(text, user = false) {
  const message = document.createElement("div");
  message.className = user ? "message user" : "message";
  for (const line of text.split("\n")) {
    const row = document.createElement("div");
    row.dir = "auto";
    row.textContent = line || " ";
    message.append(row);
  }
  chat.append(message);
  chat.scrollTop = chat.scrollHeight;
}
async function api(path, body) {
  const headers = {"X-Star-Token": token};
  const options = {headers, cache: "no-store"};
  if (body !== undefined) {
    options.method = "POST";
    headers["Content-Type"] = "application/json";
    options.body = JSON.stringify(body);
  }
  const response = await fetch(path, options);
  if (!response.ok) throw new Error(String(response.status));
  if (response.status !== 204) return response.json();
}
async function send(text) {
  if (busy || !text.trim()) return;
  busy = true;
  buttons.forEach(button => button.disabled = true);
  try {
    await api("/ask", {text});
    add(text, true);
    if (text === input.value) input.value = "";
    while (true) {
      const state = await api("/state");
      permission.hidden = !state.prompt;
      prompt.textContent = state.prompt || "";
      if (!state.busy) {
        for (const output of state.output) add(output);
        break;
      }
      await pause(350);
    }
  } catch {
    add("تعذّر الاتصال بجلسة STAR AI. تحقق من أن البرنامج يعمل.");
  } finally {
    busy = false;
    permission.hidden = true;
    buttons.forEach(button => button.disabled = false);
  }
}
async function confirmAction(allow) {
  try {
    await api("/confirm", {allow});
    permission.hidden = true;
  } catch {
    add("انتهت مهلة الموافقة أو تعذّر إرسالها.");
  }
}
document.querySelector("#form").addEventListener("submit", event => {
  event.preventDefault();
  send(input.value);
});
for (const button of document.querySelectorAll("[data-command]"))
  button.addEventListener("click", () => send(button.dataset.command));
document.querySelector("#yes").addEventListener("click", () => confirmAction(true));
document.querySelector("#no").addEventListener("click", () => confirmAction(false));
input.focus();
</script>
</html>
